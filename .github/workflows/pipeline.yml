name: Readmissions Risk Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'config.yaml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 01_download.py (Ingest CSVs to Parquet)
        run: python src/pipeline/01_download.py

      - name: Run 02_clean_join.py (Clean, merge, feature engineering)
        run: python src/pipeline/02_clean_join.py

      - name: Run 03_export.py (Export for Power BI)
        run: python src/pipeline/03_export.py

      - name: Upload Power BI CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-export
          path: reports/powerbi_hospital_svi.csv
          retention-days: 30

      - name: Upload data dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-dictionary
          path: reports/data_dictionary.md
          retention-days: 30

      - name: Pipeline summary
        run: |
          echo "## Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| powerbi_hospital_svi.csv | $(du -h reports/powerbi_hospital_svi.csv | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| data_dictionary.md | $(du -h reports/data_dictionary.md | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Rows: $(tail -n +2 reports/powerbi_hospital_svi.csv | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- Columns: $(head -1 reports/powerbi_hospital_svi.csv | tr ',' '\n' | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
