name: Readmissions Risk Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'config.yaml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check raw data files
        run: |
          echo "Checking for required data files..."

          MISSING=0
          for f in data/raw/hrrp.csv data/raw/hospital_general_info.csv data/raw/svi.csv; do
            if [ -f "$f" ]; then
              echo "Found: $f ($(wc -l < "$f") lines)"
            else
              echo "::error::Missing: $f"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "Raw data files are missing from the repository."
            echo "Please download the data manually and commit to data/raw/:"
            echo "  - Hospital General Info: https://data.cms.gov/provider-data/dataset/xubh-q36u"
            echo "  - HRRP: https://data.cms.gov/provider-data/dataset/9n3s-kdb3"
            echo "  - SVI: https://www.atsdr.cdc.gov/placeandhealth/svi/data_documentation_download.html"
            exit 1
          fi

          echo "All data files present."

      - name: Run 01_download.py (Ingest CSVs to Parquet)
        run: python src/pipeline/01_download.py

      - name: Run 02_clean_join.py (Clean, merge, feature engineering)
        run: python src/pipeline/02_clean_join.py

      - name: Run 03_export.py (Export for Power BI)
        run: python src/pipeline/03_export.py

      - name: Validate pipeline outputs
        run: python -m src.utils.validate

      - name: Upload Power BI CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-export
          path: reports/powerbi_hospital_svi.csv
          retention-days: 30

      - name: Upload data dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-dictionary
          path: reports/data_dictionary.md
          retention-days: 30

      - name: Pipeline summary
        run: |
          echo "## Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| powerbi_hospital_svi.csv | $(du -h reports/powerbi_hospital_svi.csv | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| data_dictionary.md | $(du -h reports/data_dictionary.md | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Rows: $(tail -n +2 reports/powerbi_hospital_svi.csv | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- Columns: $(head -1 reports/powerbi_hospital_svi.csv | tr ',' '\n' | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
