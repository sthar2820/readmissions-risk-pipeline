name: Readmissions Risk Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'config.yaml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw data files
        env:
          # Update these URLs if CMS/CDC change them
          # Hospital General Info: https://data.cms.gov/provider-data/dataset/xubh-q36u
          # HRRP: https://data.cms.gov/provider-data/dataset/9n3s-kdb3
          # SVI: https://www.atsdr.cdc.gov/placeandhealth/svi/data_documentation_download.html
          HOSPITAL_INFO_URL: ${{ vars.HOSPITAL_INFO_URL || 'https://data.cms.gov/provider-data/api/1/datastore/query/xubh-q36u/0/download?format=csv' }}
          HRRP_URL: ${{ vars.HRRP_URL || 'https://data.cms.gov/provider-data/api/1/datastore/query/9n3s-kdb3/0/download?format=csv' }}
          SVI_URL: ${{ vars.SVI_URL || 'https://svi.cdc.gov/Documents/Data/2022/csv/states_counties/SVI_2022_US.csv' }}
        run: |
          mkdir -p data/raw

          echo "Downloading Hospital General Information..."
          curl -L -f -o data/raw/hospital_general_info.csv "$HOSPITAL_INFO_URL" || {
            echo "::warning::Failed to download Hospital General Info. Check URL."
            exit 1
          }

          echo "Downloading HRRP data..."
          curl -L -f -o data/raw/hrrp.csv "$HRRP_URL" || {
            echo "::warning::Failed to download HRRP data. Check URL."
            exit 1
          }

          echo "Downloading CDC SVI data..."
          curl -L -f -o data/raw/svi.csv "$SVI_URL" || {
            echo "::warning::Failed to download SVI data. Check URL."
            exit 1
          }

          echo "Download complete. Files in data/raw/:"
          ls -lh data/raw/

      - name: Run 01_download.py (Ingest CSVs to Parquet)
        run: python src/pipeline/01_download.py

      - name: Run 02_clean_join.py (Clean, merge, feature engineering)
        run: python src/pipeline/02_clean_join.py

      - name: Run 03_export.py (Export for Power BI)
        run: python src/pipeline/03_export.py

      - name: Upload Power BI CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-export
          path: reports/powerbi_hospital_svi.csv
          retention-days: 30

      - name: Upload data dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-dictionary
          path: reports/data_dictionary.md
          retention-days: 30

      - name: Pipeline summary
        run: |
          echo "## Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| powerbi_hospital_svi.csv | $(du -h reports/powerbi_hospital_svi.csv | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| data_dictionary.md | $(du -h reports/data_dictionary.md | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Rows: $(tail -n +2 reports/powerbi_hospital_svi.csv | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- Columns: $(head -1 reports/powerbi_hospital_svi.csv | tr ',' '\n' | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
